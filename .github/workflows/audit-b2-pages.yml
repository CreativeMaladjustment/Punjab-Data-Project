# Read-only audit: scripts/audit_b2_pages.py. Lists every page-image object
# in each configured B2 account/bucket, cross-references against the `pages`
# table in Postgres (Supabase), and reports images with no matching (or a
# mismatched) `pages` row, plus any page whose image was uploaded to more
# than one B2 account. Never writes to B2 or Postgres.
name: Audit B2 page images against Postgres

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: b2-upload
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run audit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          # Second account's secrets are optional (only account 1 above is
          # required) — the script detects whether they're fully set.
          B2_ENDPOINT_2: ${{ secrets.B2_ENDPOINT_2 }}
          B2_KEY_ID_2: ${{ secrets.B2_KEY_ID_2 }}
          B2_APPLICATION_KEY_2: ${{ secrets.B2_APPLICATION_KEY_2 }}
          B2_BUCKET_NAME_2: ${{ secrets.B2_BUCKET_NAME_2 }}
        run: python scripts/audit_b2_pages.py
