name: Audit ditto marks in extracted entries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: b2-upload
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run ditto mark audit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/audit_ditto_marks.py

      - name: Create summary
        if: always()
        run: |
          echo "### 📋 Ditto Mark Audit Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the **Run OCR-text parsing** step above for detailed output showing:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages with ditto marks detected" >> "$GITHUB_STEP_SUMMARY"
          echo "- Extracted catalogue entries for those pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full OCR text context" >> "$GITHUB_STEP_SUMMARY"
