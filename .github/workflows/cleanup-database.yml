name: Clean up database (free space)

# Phased, reversible-from-backup cleanup that keeps the canonical layer intact.
# Run order:  Back up database  ->  phase 1  ->  phase 2  ->  phase 3
# Every phase defaults to a DRY RUN that only prints what it would do. A real run
# needs dry_run = false, backup_confirmed ticked, and "DELETE" typed in confirm.
# Uses the session-mode pooler (port 5432) - the scripts rely on session state.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase to run"
        type: choice
        required: true
        options:
          - phase1_language_tables
          - phase1b_ocr_text
          - phase2_delete_extractions
          - phase3_reclaim_space
      dry_run:
        description: "Dry run (print only, change nothing)"
        type: boolean
        default: true
      backup_confirmed:
        description: "I ran 'Back up database' and downloaded/verified the artifact"
        type: boolean
        default: false
      confirm:
        description: 'Type DELETE to run for real'
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cleanup-database
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: b2-upload
    steps:
      - name: Guard
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          BACKUP_OK: ${{ inputs.backup_confirmed }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$DRY_RUN" != "true" ]]; then
            [[ "$BACKUP_OK" == "true" ]] || { echo "::error::Tick backup_confirmed (run 'Back up database' first)."; exit 1; }
            [[ "$CONFIRM" == "DELETE" ]] || { echo "::error::Type DELETE in confirm to run for real."; exit 1; }
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run phase
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_BACKUP_URL || secrets.SUPABASE_DB_URL }}
          PHASE: ${{ inputs.phase }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          if [[ "$DB_URL" == *":6543"* ]]; then
            echo "Transaction-pooler URL detected; using the session pooler (port 5432)."
            DB_URL="${DB_URL/:6543/:5432}"
          fi
          case "$PHASE" in
            phase1_language_tables)    file=scripts/cleanup_db/phase1_language_tables.sql ;;
            phase1b_ocr_text)          file=scripts/cleanup_db/phase1b_ocr_text.sql ;;
            phase2_delete_extractions) file=scripts/cleanup_db/phase2_delete_extractions.sql ;;
            phase3_reclaim_space)      file=scripts/cleanup_db/phase3_reclaim_space.sql ;;
            *) echo "unknown phase"; exit 1 ;;
          esac
          echo "Running $file (dry_run=$DRY_RUN)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -v dry_run="$DRY_RUN" -f "$file" | tee out.txt
          { echo "## $PHASE (dry_run=$DRY_RUN)"; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
