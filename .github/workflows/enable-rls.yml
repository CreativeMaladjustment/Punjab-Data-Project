name: Enable Row-Level Security

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would be executed without making changes
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  enable-rls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Enable RLS and create policies
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # psql supports connection URIs directly, no need to parse manually
          # This avoids issues with special characters in passwords

          # Create SQL script
          cat > enable_rls.sql << 'EOF'
          -- Enable RLS on critical tables
          ALTER TABLE IF EXISTS pages ENABLE ROW LEVEL SECURITY;
          ALTER TABLE IF EXISTS llm_extractions ENABLE ROW LEVEL SECURITY;
          ALTER TABLE IF EXISTS qc_reviews ENABLE ROW LEVEL SECURITY;
          ALTER TABLE IF EXISTS page_exclusions ENABLE ROW LEVEL SECURITY;
          ALTER TABLE IF EXISTS pcloud_files ENABLE ROW LEVEL SECURITY;

          -- Create permissive policies for authenticated database users
          -- These allow all authenticated connections (extraction workers, dashboard, QC interface)
          -- to perform operations. Unauthenticated/anonymous access is blocked.

          -- Pages table
          DROP POLICY IF EXISTS pages_select ON pages;
          DROP POLICY IF EXISTS pages_insert ON pages;
          DROP POLICY IF EXISTS pages_update ON pages;
          DROP POLICY IF EXISTS pages_delete ON pages;

          CREATE POLICY pages_select ON pages FOR SELECT USING (true);
          CREATE POLICY pages_insert ON pages FOR INSERT WITH CHECK (true);
          CREATE POLICY pages_update ON pages FOR UPDATE USING (true) WITH CHECK (true);
          CREATE POLICY pages_delete ON pages FOR DELETE USING (true);

          -- llm_extractions table
          DROP POLICY IF EXISTS llm_extractions_select ON llm_extractions;
          DROP POLICY IF EXISTS llm_extractions_insert ON llm_extractions;
          DROP POLICY IF EXISTS llm_extractions_update ON llm_extractions;

          CREATE POLICY llm_extractions_select ON llm_extractions FOR SELECT USING (true);
          CREATE POLICY llm_extractions_insert ON llm_extractions FOR INSERT WITH CHECK (true);
          CREATE POLICY llm_extractions_update ON llm_extractions FOR UPDATE USING (true) WITH CHECK (true);

          -- qc_reviews table
          DROP POLICY IF EXISTS qc_reviews_select ON qc_reviews;
          DROP POLICY IF EXISTS qc_reviews_insert ON qc_reviews;
          DROP POLICY IF EXISTS qc_reviews_update ON qc_reviews;

          CREATE POLICY qc_reviews_select ON qc_reviews FOR SELECT USING (true);
          CREATE POLICY qc_reviews_insert ON qc_reviews FOR INSERT WITH CHECK (true);
          CREATE POLICY qc_reviews_update ON qc_reviews FOR UPDATE USING (true) WITH CHECK (true);

          -- page_exclusions table
          DROP POLICY IF EXISTS page_exclusions_select ON page_exclusions;
          DROP POLICY IF EXISTS page_exclusions_insert ON page_exclusions;
          DROP POLICY IF EXISTS page_exclusions_update ON page_exclusions;

          CREATE POLICY page_exclusions_select ON page_exclusions FOR SELECT USING (true);
          CREATE POLICY page_exclusions_insert ON page_exclusions FOR INSERT WITH CHECK (true);
          CREATE POLICY page_exclusions_update ON page_exclusions FOR UPDATE USING (true) WITH CHECK (true);

          -- pcloud_files table
          DROP POLICY IF EXISTS pcloud_files_select ON pcloud_files;

          CREATE POLICY pcloud_files_select ON pcloud_files FOR SELECT USING (true);
          EOF

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "=== DRY RUN: SQL that would be executed ==="
            cat enable_rls.sql
            echo ""
            echo "To apply these changes, re-run this workflow with dry_run=false"
          else
            echo "=== Executing RLS enablement ==="
            psql "$DATABASE_URL" -f enable_rls.sql
            echo "✓ RLS enabled successfully"
          fi

      - name: Verify RLS status
        if: ${{ inputs.dry_run == false }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "=== RLS Status by Table ==="
          psql "$DATABASE_URL" \
            -c "SELECT tablename, rowsecurity FROM pg_tables WHERE schemaname='public' ORDER BY tablename;" \
            || echo "Note: Verification query may fail depending on permissions"

          echo ""
          echo "✓ Row-Level Security has been enabled on critical tables"
          echo "  - pages"
          echo "  - llm_extractions"
          echo "  - qc_reviews"
          echo "  - page_exclusions"
          echo "  - pcloud_files"
          echo ""
          echo "All authenticated database connections retain full access."
          echo "Unauthenticated/anonymous access is blocked."
