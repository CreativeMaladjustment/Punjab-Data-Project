# Calls the Hugging Face Space at floutenvy/Punjab-Data-Project
# (hf_space/app.py, running on the Space's own free ZeroGPU hardware) to
# extract catalogue entries from page images -- see
# scripts/extract_with_hf_space.py for the full reasoning, especially
# why this workflow defaults to processing just ONE page per run
# (MAX_PAGES_PER_WORKER=1): real GPU-seconds-per-call against the live
# Space hasn't been measured yet, so this starts deliberately small
# rather than assuming a throughput number.
#
# workflow_dispatch only, no schedule -- this is a manual test/validation
# step for now. Add a schedule once a run here has shown roughly how many
# pages a day's ZeroGPU quota actually supports (see
# scripts/extract_with_hf_space.py's module docstring).
#
# Rescue mode: set `source_model` to reprocess ONLY the pages that model
# already gave up on (capped-out content failures) -- same mechanic as
# the other three extraction workflows', and cross-provider: source_model
# can name an Ollama, Gemini, or HF-Inference-Providers model tag here
# too (model_tag alone decides what's rescuable).
name: Extract catalogue entries with HF Space (ZeroGPU)

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "How many pages to process this run"
        type: string
        default: "1"
      source_model:
        description: >-
          Rescue mode (optional): only reprocess pages that this OTHER
          model already gave up on (capped-out content failures, i.e. its
          "content failed" pages after 2 attempts) -- instead of the
          normal backlog. Leave as "(none)" for a normal run.
          Cross-provider: an Ollama, Gemini, or HF Inference Providers
          model tag works here too.
        type: choice
        default: "(none)"
        options:
          - "(none)"
          - glm-ocr
          - minicpm-v4.6
          - minicpm-v4.5
          - qwen3-vl:2b
          - qwen3-vl:4b
          - gemma4:e2b
          - gemini-3.1-flash-lite
          - gemini-3.6-flash
          - google-gemma-4-31B-it
          - google-gemma-4-26B-A4B-it
          - Qwen-Qwen3.6-27B
          - Qwen-Qwen3.6-35B-A3B
          - zai-org-GLM-5.3-Flash
          - moonshotai-Kimi-K3
      allow_already_extracted:
        description: >-
          By default this run skips any page that already has a successful
          extraction from ANY source (another model, the textparse:* OCR-
          text backfill, or a human correction) -- the goal is coverage,
          not spending this Space's scarce daily GPU quota on a page that
          already has data. Check this box only for a deliberate model
          bake-off/comparison run.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  extract:
    # Single worker, not a matrix -- see extract_with_hf_space.py's module
    # docstring: N parallel workers would all draw against the SAME
    # Space's shared daily ZeroGPU quota, so more workers here just means
    # faster quota exhaustion, not more pages processed.
    runs-on: ubuntu-latest
    timeout-minutes: 140
    environment: b2-upload
    env:
      # Routed through env vars rather than interpolating ${{ inputs.* }}
      # directly into run: scripts (Semgrep: yaml.github-actions.security.
      # run-shell-injection), same pattern the other extraction workflows
      # use. No `|| 'default'` fallback needed here (unlike the other
      # three workflows) since this one has no schedule trigger -- every
      # run is a workflow_dispatch, so `inputs` is always populated.
      MAX_PAGES_PER_WORKER: ${{ inputs.max_pages }}
      SOURCE_MODEL: ${{ inputs.source_model }}
      ALLOW_ALREADY_EXTRACTED: ${{ inputs.allow_already_extracted }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run extraction
        id: run
        env:
          PYTHONUNBUFFERED: "1"
          HUGGING_FACE_API_KEY: ${{ secrets.HUGGING_FACE_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_2: ${{ secrets.B2_ENDPOINT_2 }}
          B2_KEY_ID_2: ${{ secrets.B2_KEY_ID_2 }}
          B2_APPLICATION_KEY_2: ${{ secrets.B2_APPLICATION_KEY_2 }}
          B2_BUCKET_NAME_2: ${{ secrets.B2_BUCKET_NAME_2 }}
        run: |
          set +e
          python scripts/extract_with_hf_space.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Flag runtime guard trip for manual resume
        if: steps.run.outputs.exit_code == '42'
        run: |
          echo "### ⏱️ Runtime guard tripped — resume needed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The extraction stopped after ~2 hours to stay under the runner limit. Progress already recorded in Postgres means the next run picks up where this one left off." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on unexpected script error
        if: steps.run.outputs.exit_code != '0' && steps.run.outputs.exit_code != '42'
        run: exit 1
