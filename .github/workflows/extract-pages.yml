# Runs a local vision LLM (served by Ollama, on the runner itself — no
# external API, no API key) over the page images process-pdfs.yml already
# uploaded to B2, writing schema.md-shaped entry JSON back to B2.
#
# GitHub-hosted runners have no GPU, so this is CPU inference: expect it to
# be slow per page. The model list below is a shortlist of small (1B-8B),
# non-cloud-gated vision models pulled from Ollama's current vision-model
# listing (ollama.com/search?c=vision) — "cloud"-badged entries there are
# Ollama-hosted-only and can't run locally, so they're excluded. glm-ocr is
# included because it's purpose-built for document OCR, which is exactly
# this task. Pick "all" to fan them out as a matrix run so you can compare
# quality/speed across models; each model's output is namespaced separately
# in B2 so runs never clobber each other.
#
# Ollama's model library changes over time — if `ollama pull` fails for one
# of these, check https://ollama.com/library for the current tag and update
# the `options` list below.
name: Extract catalogue entries with a local LLM

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama vision model to run (or 'all' to matrix every shortlisted model)"
        type: choice
        default: minicpm-v4.6
        options:
          - minicpm-v4.6
          - qwen3-vl:2b
          - qwen3-vl:4b
          - gemma4:e2b
          - glm-ocr
          - minicpm-v4.5
          - all

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.set.outputs.models }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.model }}" = "all" ]; then
            echo 'models=["minicpm-v4.6","qwen3-vl:2b","qwen3-vl:4b","gemma4:e2b","glm-ocr","minicpm-v4.5"]' >> "$GITHUB_OUTPUT"
          else
            echo "models=[\"${{ inputs.model }}\"]" >> "$GITHUB_OUTPUT"
          fi

  extract:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.setup.outputs.models) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: b2-upload
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 2
          done
          echo "Ollama server did not come up in time"; cat ollama.log; exit 1

      - name: Pull model
        run: ollama pull "${{ matrix.model }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run extraction
        id: run
        env:
          OLLAMA_MODEL: ${{ matrix.model }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          set +e
          python scripts/extract_with_llm.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Flag runtime guard trip for manual resume
        if: steps.run.outputs.exit_code == '42'
        run: |
          echo "### ⏱️ Runtime guard tripped for \`${{ matrix.model }}\` — resume needed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The extraction stopped after ~5 hours to stay under the runner limit. Already-written page JSON and .done markers in B2 mean the next run picks up where this one left off." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action needed:** re-run this workflow with the same model (\`${{ matrix.model }}\`) to continue." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on unexpected script error
        if: steps.run.outputs.exit_code != '0' && steps.run.outputs.exit_code != '42'
        run: exit 1
