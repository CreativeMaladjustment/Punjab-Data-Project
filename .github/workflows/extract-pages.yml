# Runs a local vision LLM (served by Ollama, on the runner itself — no
# external API, no API key) over the page images process-pdfs.yml already
# uploaded to B2 (looked up via Postgres), writing schema.md-shaped
# catalogue entries into Postgres (Supabase) — see
# supabase/migrations/20260909140000_init_processing_schema.sql. No B2
# writes happen here; B2 is read-only from this workflow's point of view.
#
# GitHub-hosted runners have no GPU, so this is CPU inference: expect it to
# be slow per page. The model list below is a shortlist of small (1B-8B),
# non-cloud-gated vision models pulled from Ollama's current vision-model
# listing (ollama.com/search?c=vision) — "cloud"-badged entries there are
# Ollama-hosted-only and can't run locally, so they're excluded. glm-ocr is
# included because it's purpose-built for document OCR, which is exactly
# this task. Default is minicpm-v4.5 (8B): the largest model in this
# CPU-feasible set, and MiniCPM-V's line has a well-established track record
# on OCR/document-understanding benchmarks combined with being a full
# general-purpose model (so it should follow the 25-field schema more
# reliably than a narrower or smaller model) — reasoned from published
# model positioning, not benchmarked here; treat actual output quality as
# the real source of truth once you can eyeball it. Each model's output is
# namespaced separately in Postgres (llm_extractions.model_tag) so runs
# against different models never clobber each other.
#
# Ollama's model library changes over time — if `ollama pull` fails for one
# of these, check https://ollama.com/library for the current tag and update
# the `options` list below.
name: Extract catalogue entries with a local LLM

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama vision model to run"
        type: choice
        default: minicpm-v4.5
        options:
          - minicpm-v4.6
          - qwen3-vl:2b
          - qwen3-vl:4b
          - gemma4:e2b
          - glm-ocr
          - minicpm-v4.5

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: b2-upload
    env:
      # Routed through an env var rather than interpolating ${{ inputs.model }}
      # directly into run: scripts below (Semgrep: yaml.github-actions.security.
      # run-shell-injection) -- inputs.model is a fixed `type: choice` today, but
      # this is the correct pattern regardless of whether that stays true.
      OLLAMA_MODEL_INPUT: ${{ inputs.model }}
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Ollama
        # Downloaded then executed as separate steps (not curl | sh) to avoid
        # streaming an unreviewed script straight into a shell. This doesn't
        # remove the underlying trust-Ollama's-installer tradeoff — Ollama
        # doesn't publish a simple checksum/signature for this script — just
        # the literal piping pattern.
        run: |
          curl -fsSL https://ollama.com/install.sh -o install-ollama.sh
          sh install-ollama.sh

      - name: Cache Ollama model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # ~ resolves to whatever $HOME "ollama serve" below will use (this
          # step runs as the same user, on the same runner) -- avoids
          # hardcoding a path that only holds for the separate
          # systemd-service install this workflow doesn't use. Restored
          # *before* the server starts: it runs backgrounded and stays alive
          # through every later step, so extracting into ~/.ollama while it's
          # already serving requests against that same directory risks
          # contention/partial state. Keyed per model since each pull is
          # several GB; "ollama pull" only re-fetches a manifest and skips
          # any blob already on disk with a matching digest, so a cache hit
          # turns that step into a fast no-op instead of a multi-GB download.
          path: ~/.ollama
          key: ollama-model-${{ inputs.model }}

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 2
          done
          echo "Ollama server did not come up in time"; cat ollama.log; exit 1

      - name: Pull model
        run: ollama pull "$OLLAMA_MODEL_INPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run extraction
        id: run
        env:
          # Without this, Python fully buffers stdout when it isn't a TTY
          # (as here) -- print() output sits in memory until the buffer
          # fills or the process exits cleanly, so a long run or one that
          # gets cancelled mid-way can show *zero* log output even though
          # DB writes (a separate, immediate network call per page) went
          # through the whole time.
          PYTHONUNBUFFERED: "1"
          OLLAMA_MODEL: ${{ inputs.model }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          # Second account's secrets are optional (only account 1 above is
          # required) — the scripts detect whether they're fully set.
          B2_ENDPOINT_2: ${{ secrets.B2_ENDPOINT_2 }}
          B2_KEY_ID_2: ${{ secrets.B2_KEY_ID_2 }}
          B2_APPLICATION_KEY_2: ${{ secrets.B2_APPLICATION_KEY_2 }}
          B2_BUCKET_NAME_2: ${{ secrets.B2_BUCKET_NAME_2 }}
        run: |
          set +e
          python scripts/extract_with_llm.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Flag runtime guard trip for manual resume
        if: steps.run.outputs.exit_code == '42'
        run: |
          echo "### ⏱️ Runtime guard tripped for \`$OLLAMA_MODEL_INPUT\` — resume needed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The extraction stopped after ~5 hours to stay under the runner limit. Progress already recorded in Postgres means the next run picks up where this one left off." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action needed:** re-run this workflow with the same model (\`$OLLAMA_MODEL_INPUT\`) to continue." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on unexpected script error
        if: steps.run.outputs.exit_code != '0' && steps.run.outputs.exit_code != '42'
        run: exit 1
