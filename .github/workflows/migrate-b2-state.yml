# One-time backfill: scripts/migrate_b2_state_to_db.py. Discovers the .done
# markers (and, for LLM output, the per-page JSON files) that
# process_pcloud.py and extract_with_llm.py wrote to B2 before this pipeline
# moved to Postgres, writes the equivalent rows into Postgres, and — only in
# execute mode — deletes the now-redundant .done marker objects from B2.
# Page images, page PDFs, and extraction JSON content are left untouched;
# only .done/.with-pdfs.done markers are ever deleted.
#
# Defaults to a dry run every time (lists what it would do, writes and
# deletes nothing) — you must explicitly tick "Actually commit changes" to
# have it write to Postgres and delete markers. Safe to re-run either way:
# every DB write is an upsert, and a stem already fully migrated is skipped.
name: Migrate B2 .done markers to Postgres

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually commit changes (write to Postgres, delete .done markers). Leave unchecked for a dry run."
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: b2-upload
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run migration
        env:
          EXECUTE_FLAG: ${{ inputs.execute }}
          PCLOUD_CODE: ${{ vars.PCLOUD_CODE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_2: ${{ secrets.B2_ENDPOINT_2 }}
          B2_KEY_ID_2: ${{ secrets.B2_KEY_ID_2 }}
          B2_APPLICATION_KEY_2: ${{ secrets.B2_APPLICATION_KEY_2 }}
          B2_BUCKET_NAME_2: ${{ secrets.B2_BUCKET_NAME_2 }}
        run: |
          if [ "$EXECUTE_FLAG" = "true" ]; then
            python scripts/migrate_b2_state_to_db.py --execute
          else
            python scripts/migrate_b2_state_to_db.py
          fi
