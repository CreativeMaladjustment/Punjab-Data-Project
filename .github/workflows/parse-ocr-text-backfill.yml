name: Parse OCR text to structured entries (backfill)

on:
  workflow_dispatch:
    inputs:
      text_model:
        description: "Ollama text model to run"
        type: choice
        default: mistral:7b
        options:
          - mistral:7b
          - llama3.1:8b
          - llama3.2:3b
          - neural-chat:7b
          - openchat:3.5

permissions:
  contents: read

jobs:
  parse_ocr_backfill:
    runs-on: self-hosted
    timeout-minutes: 350
    environment: b2-upload
    env:
      TEXT_MODEL_INPUT: ${{ inputs.text_model || 'mistral:7b' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Ollama is installed
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "Ollama not found on PATH. Install it yourself first (e.g. 'brew install ollama' or https://ollama.com/download), then re-run this workflow."
            exit 1
          fi
          ollama --version

      - name: Start Ollama server
        run: |
          if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "Ollama server already running -- reusing it"
            exit 0
          fi
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 2
          done
          echo "Ollama server did not come up in time"; cat ollama.log; exit 1

      - name: Pull model
        run: ollama pull "$TEXT_MODEL_INPUT"

      - name: Verify Python 3 is installed
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 not found on PATH. Install it yourself first (e.g. 'brew install python3'), then re-run this workflow."
            exit 1
          fi
          python3 --version

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scripts/requirements.txt

      - name: Run OCR text parsing (backfill 741 OCR-only pages, smallest first)
        id: run
        env:
          PYTHONUNBUFFERED: "1"
          TEXT_MODEL: ${{ inputs.text_model || 'mistral:7b' }}
          MAX_PAGES_PER_WORKER: "2000"
          PROCESS_OCR_ONLY_PAGES: "true"
          PRIORITIZE_LARGE_PAGES: "false"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e

          # Count pages with OCR but no structured extraction
          BACKFILL_COUNT=$(psql "$SUPABASE_DB_URL" -t -c "
            SELECT COUNT(DISTINCT p.id)
            FROM pages p
            WHERE p.image_uploaded_at IS NOT NULL
              AND p.excluded_at IS NULL
              AND EXISTS (SELECT 1 FROM page_ocr_text pot WHERE pot.page_id = p.id AND pot.status = 'success')
              AND NOT EXISTS (SELECT 1 FROM llm_extractions le WHERE le.page_id = p.id AND le.status = 'success' AND le.model_tag <> ALL(ARRAY['gemma-4-31b-it', 'gemma-4-26b-a4b-it']::text[]))
          " 2>/dev/null || echo "unknown")

          echo "Processing $BACKFILL_COUNT OCR-only pages with $TEXT_MODEL_INPUT (smallest first)"

          .venv/bin/python scripts/parse_ocr_text.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Flag runtime guard trip for manual resume
        if: steps.run.outputs.exit_code == '42'
        run: |
          echo "### ⏱️ Runtime guard tripped for OCR backfill with \`$TEXT_MODEL_INPUT\` — resume needed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The backfill processing stopped after ~5.8 hours to stay under the runner limit. Progress already recorded in Postgres means the next run picks up where this one left off." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action needed:** Re-run this workflow to continue processing the remaining OCR-only pages." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on unexpected script error
        if: steps.run.outputs.exit_code != '0' && steps.run.outputs.exit_code != '42'
        run: exit 1

      - name: Summary
        if: always()
        run: |
          echo "## OCR Text Backfill Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Processed OCR-only pages (pages with successful OCR transcription but no structured extraction) using \`$TEXT_MODEL_INPUT\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Processing strategy:** Smallest OCR pages first (1.5K–20K chars) for faster feedback, then larger pages (20K–52K chars)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See job logs for detailed results." >> $GITHUB_STEP_SUMMARY
