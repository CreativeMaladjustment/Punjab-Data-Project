# Companion to parse-ocr-text-self-hosted.yml: prioritizes OCR pages > 20K characters
# for manual cleanup of timeout-prone large pages.
#
# The default parse-ocr-text-self-hosted.yml workflow prioritizes smaller pages
# (< 20K chars, ~80% of records) for faster throughput and lower timeout risk.
# This workflow is for manually processing the remaining 19.38% of large pages
# that are more prone to timeouts (see analysis in GitHub issue comments).
#
# Usage: Manual workflow_dispatch only — no schedule. Trigger when you want to
# specifically target the backlog of large pages with a fresh timeout budget.
#
# Data distribution (from page_ocr_text character length analysis):
#   - < 5K:    55.50% (safe, fast)
#   - 5K-10K:  11.68% (safe)
#   - 10K-20K: 13.44% (safe)
#   - 20K-30K: 12.94% (timeout risk, similar to failed case)
#   - 30K-50K:  6.23% (high risk)
#   - > 50K:    0.20% (critical risk, some reach 163K chars)
#
# This workflow sets PRIORITIZE_LARGE_PAGES=true to reverse the sort order,
# processing pages in DESC order by size.

name: Parse structured entries from OCR text (large pages, self-hosted)

on:
  workflow_dispatch:
    inputs:
      text_model:
        description: "Ollama text model to run"
        type: choice
        default: llama3.1:8b
        options:
          - llama3.1:8b
          - llama3.2:3b
          - qwen2.5:7b
          - mistral:7b

permissions:
  contents: read

jobs:
  parse_large:
    runs-on: self-hosted
    timeout-minutes: 350
    environment: b2-upload
    env:
      TEXT_MODEL_INPUT: ${{ inputs.text_model || 'llama3.1:8b' }}
      PRIORITIZE_LARGE_PAGES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Ollama is installed
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "Ollama not found on PATH. Install it yourself first (e.g. 'brew install ollama' or https://ollama.com/download), then re-run this workflow."
            exit 1
          fi
          ollama --version

      - name: Start Ollama server
        run: |
          if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "Ollama server already running -- reusing it"
            exit 0
          fi
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 2
          done
          echo "Ollama server did not come up in time"; cat ollama.log; exit 1

      - name: Pull model
        run: ollama pull "$TEXT_MODEL_INPUT"

      - name: Verify Python 3 is installed
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 not found on PATH. Install it yourself first (e.g. 'brew install python3'), then re-run this workflow."
            exit 1
          fi
          python3 --version

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scripts/requirements.txt

      - name: Run OCR-text parsing (large pages)
        id: run
        env:
          PYTHONUNBUFFERED: "1"
          TEXT_MODEL: ${{ inputs.text_model || 'llama3.1:8b' }}
          MAX_PAGES_PER_WORKER: "2000"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          .venv/bin/python scripts/parse_ocr_text.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Flag runtime guard trip for manual resume
        if: steps.run.outputs.exit_code == '42'
        run: |
          echo "### ⏱️ Runtime guard tripped for large-page run with \`$TEXT_MODEL_INPUT\` (self-hosted) — resume needed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The large-page processing stopped after ~5 hours to stay under the runner limit. Progress already recorded in Postgres means the next run picks up where this one left off." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action needed:** re-run this workflow with the same text model (\`$TEXT_MODEL_INPUT\`) to continue processing large pages." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on unexpected script error
        if: steps.run.outputs.exit_code != '0' && steps.run.outputs.exit_code != '42'
        run: exit 1
