# Same job as parse-ocr-text.yml (backfills structured catalogue entries
# from already-successful full-page OCR transcriptions -- see
# scripts/parse_ocr_text.py's module docstring for the full reasoning), but
# on the same self-hosted runner extract-pages-local.yml already targets,
# as a second, independent workflow rather than a change to that one --
# both parse-ocr-text.yml and this one can run concurrently without
# conflict (scripts/parse_ocr_text.py's claim_next_page() uses `FOR UPDATE
# SKIP LOCKED`, the same safe-for-concurrent-workers pattern every
# extraction script in this repo relies on), so this is pure additional
# throughput on top of parse-ocr-text.yml, not a replacement for it.
#
# Everything below the trigger mirrors extract-pages-local.yml's own
# conventions for that same runner rather than parse-ocr-text.yml's
# GitHub-hosted steps -- confirmed (via that workflow's own comments) to be
# macOS, a real persistent machine, not an ephemeral Linux VM:
#   - No matrix: a self-hosted runner is a single machine you control, not
#     GitHub's shared pool, so a multi-job matrix against it would just
#     queue sequentially on the same box (or contend for the same local
#     Ollama server) for no benefit.
#   - No "free runner disk space" step: that only clears GitHub-hosted
#     ubuntu-latest's pre-installed toolchain bloat on a shared image you
#     don't control.
#   - No `curl -fsSL https://ollama.com/install.sh` / actions/cache for the
#     Ollama binary: that's the Linux installer, and it also silently
#     modifies a persistent machine on every cache miss -- installing
#     system software on your own machine without you doing it yourself
#     once, deliberately, isn't something CI should do. "Verify Ollama is
#     installed" below fails with instructions instead, exactly matching
#     extract-pages-local.yml.
#   - No actions/setup-python: its tool-cache step creates
#     $RUNNER_TOOL_CACHE under /Users/runner/hostedtoolcache, a GitHub-
#     hosted-macOS-runner-only path this self-hosted runner doesn't set --
#     extract-pages-local.yml confirmed this fails outright ("mkdir:
#     /Users/runner: Permission denied") on this exact runner. "Verify
#     Python 3 is installed" + a venv below matches that workflow instead.
#   - No actions/cache for the Ollama model either: `~/.ollama` already
#     persists on local disk between runs on a real machine.
#
# Trigger: schedule (not workflow_dispatch-only like extract-pages-local.yml)
# is a deliberate difference, not an oversight -- that workflow's own
# security note is specifically about never adding a pull_request (or any
# fork-reachable) trigger to a workflow targeting a self-hosted runner,
# since a fork PR author could then run arbitrary code on your machine.
# `schedule` isn't fork-reachable (only this repo's own committed cron,
# evaluated by GitHub against the default branch) and carries none of that
# risk, so it's kept here to match parse-ocr-text.yml's own cadence.
name: Parse structured entries from OCR text (self-hosted)

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      text_model:
        description: "Ollama text model to run"
        type: choice
        default: llama3.1:8b
        options:
          - llama3.1:8b
          - llama3.2:3b
          - qwen2.5:7b
          - mistral:7b

permissions:
  contents: read

jobs:
  parse:
    # Matches any self-hosted runner registered to this repo -- fine while
    # there's exactly one (see extract-pages-local.yml's own comment on
    # this same choice). If a second is ever added, narrow this to a
    # distinguishing label.
    runs-on: self-hosted
    timeout-minutes: 350
    environment: b2-upload  # where SUPABASE_DB_URL lives; no B2 secrets are
    # actually used here -- see the module docstring in parse_ocr_text.py.
    env:
      # Routed through an env var rather than interpolating
      # ${{ inputs.text_model }} directly into run: scripts (Semgrep:
      # yaml.github-actions.security.run-shell-injection) -- same pattern
      # parse-ocr-text.yml uses for inputs.text_model. `|| 'llama3.1:8b'`
      # reapplies the input's own declared default for a schedule-triggered
      # run, whose `inputs` context is empty -- without this a scheduled
      # run would try `ollama pull ""` and fail outright.
      TEXT_MODEL_INPUT: ${{ inputs.text_model || 'llama3.1:8b' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Ollama is installed
        # Intentionally does not auto-install -- see extract-pages-local.yml's
        # own comment on this exact step.
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            echo "Ollama not found on PATH. Install it yourself first (e.g. 'brew install ollama' or https://ollama.com/download), then re-run this workflow."
            exit 1
          fi
          ollama --version

      - name: Start Ollama server
        run: |
          if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "Ollama server already running -- reusing it"
            exit 0
          fi
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 2
          done
          echo "Ollama server did not come up in time"; cat ollama.log; exit 1

      - name: Pull model
        run: ollama pull "$TEXT_MODEL_INPUT"

      - name: Verify Python 3 is installed
        # Not actions/setup-python -- see the module comment above (and
        # extract-pages-local.yml's identical step) for why it fails on
        # this runner.
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 not found on PATH. Install it yourself first (e.g. 'brew install python3'), then re-run this workflow."
            exit 1
          fi
          python3 --version

      - name: Install Python dependencies
        # A venv, not a bare `pip install` -- see extract-pages-local.yml's
        # own comment on this same step (persistent, shared machine; newer
        # Homebrew Python's "externally-managed-environment" pip refusal).
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scripts/requirements.txt

      - name: Run OCR-text parsing
        id: run
        env:
          PYTHONUNBUFFERED: "1"
          TEXT_MODEL: ${{ inputs.text_model || 'llama3.1:8b' }}
          MAX_PAGES_PER_WORKER: "2000"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          .venv/bin/python scripts/parse_ocr_text.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Flag runtime guard trip for manual resume
        if: steps.run.outputs.exit_code == '42'
        run: |
          echo "### ⏱️ Runtime guard tripped for \`$TEXT_MODEL_INPUT\` (self-hosted) — resume needed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The run stopped after ~5 hours to stay under the runner limit. Progress already recorded in Postgres means the next run picks up where this one left off." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action needed:** re-run this workflow with the same text model (\`$TEXT_MODEL_INPUT\`) to continue." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on unexpected script error
        if: steps.run.outputs.exit_code != '0' && steps.run.outputs.exit_code != '42'
        run: exit 1
