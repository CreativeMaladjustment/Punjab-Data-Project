# Backfills structured catalogue entries from already-successful full-page
# OCR transcriptions (page_ocr_text) for pages that don't yet have a
# successful structured extraction under the primary model (glm-ocr) --
# see scripts/parse_ocr_text.py's module docstring for the full reasoning.
#
# Unlike extract-pages.yml, this workflow never touches page images or B2:
# the only input is the OCR text already sitting in Postgres, and the only
# output is Postgres writes -- so no B2 secrets are used here at all, and
# there's no image-decode/vision-token cost, just a much cheaper text-only
# Ollama call per page.
#
# Was workflow_dispatch-only, so this backfill only ever ran when someone
# remembered to trigger it by hand -- meaning OCR text from every model
# (glm-ocr's own, and since extract-pages-gemini.yml's gemma-4-31b-it/
# gemma-4-26b-a4b-it went OCR-only -- see that script's GEMMA_OCR_ONLY_TAGS
# -- theirs too) just sat in page_ocr_text unused between manual runs.
# Scheduled 4x/day now so it actually keeps up with what extract-pages.yml
# and extract-pages-gemini.yml are producing.
#
# Runs on a self-hosted runner, not GitHub-hosted -- was a 5-worker matrix
# on ubuntu-latest, but a self-hosted runner is a single machine you
# control, not GitHub's shared/ephemeral pool: a 5-job matrix against it
# would just queue sequentially on one box (or contend for the same Ollama
# server/GPU) for no benefit, so this is a single, unmatrixed job instead.
name: Parse structured entries from OCR text

on:
  # See extract-pages.yml's own schedule comment for why every `inputs.*`
  # reference below (not just this job-level env var, but the cache key and
  # step env further down too -- a schedule event's `inputs` context is
  # empty) carries the same `|| 'llama3.1:8b'` fallback repeated verbatim,
  # reapplying the input's own declared default for a scheduled run.
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      text_model:
        description: "Ollama text model to run"
        type: choice
        default: llama3.1:8b
        options:
          - llama3.1:8b
          - llama3.2:3b
          - qwen2.5:7b
          - mistral:7b

permissions:
  contents: read

jobs:
  parse:
    # self-hosted: no `matrix:` -- see the module comment above for why a
    # matrix doesn't make sense against one self-owned machine. If you ever
    # register more than one self-hosted runner for this repo and want to
    # target a specific one, add its custom label here (e.g.
    # `[self-hosted, gpu-box]`) -- plain `self-hosted` matches any
    # registered self-hosted runner, which is fine with just one.
    runs-on: self-hosted
    timeout-minutes: 350
    environment: b2-upload  # where SUPABASE_DB_URL lives; no B2 secrets are
    # actually used here -- see the module docstring in parse_ocr_text.py.
    env:
      # Routed through an env var rather than interpolating
      # ${{ inputs.text_model }} directly into run: scripts (Semgrep:
      # yaml.github-actions.security.run-shell-injection) -- same pattern
      # extract-pages.yml uses for inputs.model. `|| 'llama3.1:8b'`
      # reapplies the input's own declared default for a schedule-triggered
      # run, whose `inputs` context is empty -- without this a scheduled
      # run would try `ollama pull ""` and fail outright.
      TEXT_MODEL_INPUT: ${{ inputs.text_model || 'llama3.1:8b' }}
      OLLAMA_VERSION: "0.34.0"  # keep in sync with extract-pages.yml
    steps:
      # No "free runner disk space" step here -- that only exists in
      # extract-pages.yml/extract-pages-gemini.yml to clear GitHub-hosted
      # ubuntu-latest's pre-installed toolchain bloat (a shared, ephemeral
      # image you don't control); a self-hosted runner is your own machine,
      # so you manage its disk directly.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache Ollama binary
        id: cache-ollama-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ollama-bin
          key: ollama-bin-${{ env.OLLAMA_VERSION }}

      - name: Restore Ollama binary from cache
        if: steps.cache-ollama-bin.outputs.cache-hit == 'true'
        run: |
          sudo mkdir -p /usr/local/lib/ollama
          sudo cp ~/.cache/ollama-bin/ollama /usr/local/bin/ollama
          sudo chmod 755 /usr/local/bin/ollama
          sudo cp -r ~/.cache/ollama-bin/lib/. /usr/local/lib/ollama/
          command -v ollama

      - name: Install Ollama
        if: steps.cache-ollama-bin.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL https://ollama.com/install.sh -o install-ollama.sh && sh install-ollama.sh; then
              exit 0
            fi
            echo "Ollama install attempt $attempt failed"
            if [ "$attempt" -lt 5 ]; then
              sleep $((2 ** attempt))
            fi
          done
          echo "Ollama install failed after 5 attempts"
          exit 1

      - name: Populate Ollama binary cache
        if: steps.cache-ollama-bin.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/ollama-bin/lib
          cp /usr/local/bin/ollama ~/.cache/ollama-bin/ollama
          cp -r /usr/local/lib/ollama/. ~/.cache/ollama-bin/lib/

      - name: Cache Ollama model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ollama
          key: ollama-model-${{ inputs.text_model || 'llama3.1:8b' }}

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 2
          done
          echo "Ollama server did not come up in time"; cat ollama.log; exit 1

      - name: Pull model
        run: ollama pull "$TEXT_MODEL_INPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run OCR-text parsing
        id: run
        env:
          PYTHONUNBUFFERED: "1"
          TEXT_MODEL: ${{ inputs.text_model || 'llama3.1:8b' }}
          MAX_PAGES_PER_WORKER: "2000"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          python scripts/parse_ocr_text.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Flag runtime guard trip for manual resume
        if: steps.run.outputs.exit_code == '42'
        run: |
          echo "### ⏱️ Runtime guard tripped for \`$TEXT_MODEL_INPUT\` — resume needed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The run stopped after ~5 hours to stay under the runner limit. Progress already recorded in Postgres means the next run picks up where this one left off." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action needed:** re-run this workflow with the same text model (\`$TEXT_MODEL_INPUT\`) to continue." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on unexpected script error
        if: steps.run.outputs.exit_code != '0' && steps.run.outputs.exit_code != '42'
        run: exit 1
