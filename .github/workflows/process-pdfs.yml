name: Process pCloud PDFs to B2

on:
  workflow_dispatch:
    inputs:
      upload_page_pdfs:
        description: "Also split and upload a single-page PDF per page (in addition to the WebP image, which is always uploaded)"
        type: boolean
        default: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: b2-upload
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run pCloud to B2 pipeline
        id: run
        env:
          PCLOUD_CODE: ${{ vars.PCLOUD_CODE }}
          UPLOAD_PAGE_PDFS: ${{ inputs.upload_page_pdfs }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          # Second account's secrets are optional (only account 1 above is
          # required) — the scripts detect whether they're fully set.
          B2_ENDPOINT_2: ${{ secrets.B2_ENDPOINT_2 }}
          B2_KEY_ID_2: ${{ secrets.B2_KEY_ID_2 }}
          B2_APPLICATION_KEY_2: ${{ secrets.B2_APPLICATION_KEY_2 }}
          B2_BUCKET_NAME_2: ${{ secrets.B2_BUCKET_NAME_2 }}
        run: |
          set +e
          python scripts/process_pcloud.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Flag runtime guard trip for manual resume
        if: steps.run.outputs.exit_code == '42'
        run: |
          echo "### ⏱️ Runtime guard tripped — resume needed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The pipeline stopped after ~5 hours to stay under the runner limit. Progress already recorded in Postgres means the next run picks up where this one left off." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action needed:** re-run this workflow (Actions → Process pCloud PDFs to B2 → Run workflow) to continue processing." >> "$GITHUB_STEP_SUMMARY"

      - name: Flag both-accounts-failed
        if: steps.run.outputs.exit_code == '43'
        run: |
          echo "### 🚨 Every configured B2 account failed repeatedly — stopped early" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Uploads failed on every configured B2 account several times in a row, so the run stopped instead of spending the rest of the runtime budget failing the same way. Unlike a runtime-guard stop (exit 42, which just means \"resume whenever\"), this job is marked failed on purpose: it means every account is currently unusable and needs a person to look at it." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Action needed:** check both accounts' credentials, storage caps, and quotas, then re-run this workflow once resolved." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on unexpected script error
        if: steps.run.outputs.exit_code != '0' && steps.run.outputs.exit_code != '42'
        run: exit 1
