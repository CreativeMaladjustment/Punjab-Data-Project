# Deletes images/*.webp objects in either B2 account that have no matching
# pcloud_files row at all (see scripts/audit_b2_pages.py's "no matching
# pcloud_files row" finding). Such an image isn't tracked by anything, and
# process_pcloud.py doesn't consult existing B2 objects before it
# (re)uploads a PDF's pages anyway -- so keeping it around preserves
# nothing.
#
# Defaults to a dry run every time (lists what it would delete, changes
# nothing) -- you must explicitly tick "Actually commit changes" to have it
# delete. Safe to re-run.
name: Remove unlinked B2 images

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually commit changes (delete unlinked images). Leave unchecked for a dry run."
        type: boolean
        default: false

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: b2-upload
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run remover
        env:
          EXECUTE_FLAG: ${{ inputs.execute }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          # Second account's secrets are optional (only account 1 above is
          # required) — the script detects whether they're fully set.
          B2_ENDPOINT_2: ${{ secrets.B2_ENDPOINT_2 }}
          B2_KEY_ID_2: ${{ secrets.B2_KEY_ID_2 }}
          B2_APPLICATION_KEY_2: ${{ secrets.B2_APPLICATION_KEY_2 }}
          B2_BUCKET_NAME_2: ${{ secrets.B2_BUCKET_NAME_2 }}
        run: |
          if [ "$EXECUTE_FLAG" = "true" ]; then
            python scripts/remove_unlinked_images.py --execute
          else
            python scripts/remove_unlinked_images.py
          fi
