# Frees up B2 account 2 space by removing pages whose image also exists in
# account 1 (see scripts/audit_b2_pages.py's "duplicate" report). Account 1
# is treated as authoritative and is never touched: for each duplicate, the
# `pages` row is repointed to account 1 (if it isn't already) and then the
# redundant account-2 copy is deleted.
#
# Defaults to a dry run every time (lists what it would do, changes
# nothing) -- you must explicitly tick "Actually commit changes" to have it
# repoint pages rows and delete duplicates. Safe to re-run either way.
name: Resolve duplicate B2 pages

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually commit changes (repoint pages rows, delete account-2 duplicates). Leave unchecked for a dry run."
        type: boolean
        default: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: b2-upload
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run resolver
        env:
          EXECUTE_FLAG: ${{ inputs.execute }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_2: ${{ secrets.B2_ENDPOINT_2 }}
          B2_KEY_ID_2: ${{ secrets.B2_KEY_ID_2 }}
          B2_APPLICATION_KEY_2: ${{ secrets.B2_APPLICATION_KEY_2 }}
          B2_BUCKET_NAME_2: ${{ secrets.B2_BUCKET_NAME_2 }}
        run: |
          if [ "$EXECUTE_FLAG" = "true" ]; then
            python scripts/resolve_duplicate_pages.py --execute
          else
            python scripts/resolve_duplicate_pages.py
          fi
