# SAST/DAST scanning, all with free/open-source tooling.
#
# DAST note: the only deployed surface this repo has is the static GitHub
# Pages explorer (no backend/API, no per-PR preview deployments). The ZAP
# baseline job therefore always scans the current production URL — on a PR
# run this is a drift/regression check against production, not a test of
# that PR's own changes. If preview deployments are added later, point the
# `target` input at the preview URL instead for PR runs.
name: Security scans (SAST/DAST)

on:
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  bandit-semgrep:
    name: Bandit + Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install scanners
        run: pip install bandit bandit-sarif-formatter semgrep

      - name: Run Bandit
        run: bandit -r . -f sarif -o bandit-results.sarif --exit-zero --exclude ./.git

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --sarif --sarif-output=semgrep-results.sarif \
            . || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      - name: Run gitleaks
        run: |
          gitleaks detect \
            --no-git --source . \
            --config .gitleaks.toml \
            --report-format sarif --report-path gitleaks-results.sarif \
            --exit-code 0

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          echo "## pip-audit: scripts/requirements.txt" >> "$GITHUB_STEP_SUMMARY"
          pip-audit -r scripts/requirements.txt -f markdown >> "$GITHUB_STEP_SUMMARY" || true
          pip-audit -r scripts/requirements.txt

  dast-zap-baseline:
    name: OWASP ZAP baseline (DAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ZAP baseline scan (passive) against the live explorer
        uses: zaproxy/action-baseline@v0.13.0
        continue-on-error: true
        with:
          target: "https://tgraves719.github.io/Punjab-Data-Project/"
          allow_issue_writing: false
          fail_action: false
