name: Translate canonical titles to English

on:
  schedule:
    # Run every hour to continuously process pages
    - cron: "30 * * * *"  # Every hour at :30
  workflow_dispatch:
    inputs:
      max_batches:
        description: "Maximum batches of titles to process (0 = unlimited)"
        type: number
        default: 0

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: b2-upload  # Where GEMINI_API_KEY lives
    env:
      MAX_BATCHES: ${{ inputs.max_batches || 0 }}
      MAX_RUNTIME_SECONDS: 3600  # 60 minutes
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Translate canonical titles
        id: run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          python scripts/translate_canonical_titles.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Flag runtime guard trip for manual resume
        if: steps.run.outputs.exit_code == '42'
        run: |
          echo "### ⏱️ Runtime guard tripped for title translation — resume needed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The title translation stopped after ~60 minutes to stay under the runner limit. Progress already recorded in Postgres means the next hourly run picks up where this one left off." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**No action needed:** the workflow will automatically re-run in the next scheduled hour." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job on unexpected script error
        if: steps.run.outputs.exit_code != '0' && steps.run.outputs.exit_code != '42'
        run: exit 1
