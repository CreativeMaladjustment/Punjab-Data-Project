<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Punjab Data Project{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f1ea;
    --panel: #faf8f3;
    --ink: #241f1a;
    --border: #ded6c8;
    --border-soft: #ece5d8;
    --border-faint: #e6dfd2;
    --muted: #6d6258;
    --muted-2: #7d7266;
    --body-text: #5a5047;
    --body-text-2: #4a413a;
    --brick: #8a4028;
    --brick-dark: #5e2a19;
    --brick-hover: #6e3220;
    --dark: #241f1a;
    --dark-hover: #3d342c;
    --green: #2f6b47;
    --green-hover: #245537;
    --green-bg: #e4efe7;
    --brick-bg: #f3e6e0;
    --input-bg: #fffdf9;
    --input-border: #d8cfbe;
    --tint: #efe9dd;
    --tint-2: #f1ece1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }
  a { color: var(--brick); }
  a:hover { color: var(--brick-dark); }
  code { font-family: "IBM Plex Mono", monospace; }
  table { border-collapse: collapse; }
  input, textarea, button, select { font-family: inherit; }

  .site-header {
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .site-header-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 32px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .site-brand {
    display: flex;
    align-items: baseline;
    gap: 14px;
    min-width: 0;
  }
  .site-brand a {
    font: 500 15px/1 "IBM Plex Sans", sans-serif;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-decoration: none;
  }
  .site-brand .archive-ref {
    font: 400 11px/1 "IBM Plex Mono", monospace;
    color: var(--muted);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .site-nav {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
  }
  .site-nav a {
    font: 500 13px/1 "IBM Plex Sans", sans-serif;
    padding: 9px 14px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    color: var(--body-text);
    background: transparent;
  }
  .site-nav a:hover { background: var(--tint); color: var(--ink); }
  .site-nav a.active { color: var(--panel); background: var(--dark); }
  .site-nav a.active:hover { background: var(--dark); }

  {% block extra_style %}{% endblock %}
</style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-brand">
        <a href="{{ url_for('overview') }}">Punjab Data Project</a>
        <span class="archive-ref">IOR SV 412/44 &middot; 1867&ndash;1942</span>
      </div>
      <nav class="site-nav">
        <a href="{{ url_for('overview') }}" class="{{ 'active' if active == 'overview' else '' }}">Overview</a>
        <a href="{{ url_for('progress') }}" class="{{ 'active' if active == 'progress' else '' }}">Progress</a>
        <a href="{{ url_for('qc_index') }}" class="{{ 'active' if active == 'qc' else '' }}">QC review</a>
        <a href="{{ url_for('tables_index') }}" class="{{ 'active' if active == 'tables' else '' }}">Tables</a>
        <a href="{{ url_for('method') }}" class="{{ 'active' if active == 'method' else '' }}">Method</a>
        <a href="{{ url_for('sources') }}" class="{{ 'active' if active == 'sources' else '' }}">Sources</a>
      </nav>
    </div>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
